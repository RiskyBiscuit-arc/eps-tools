name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # The tests stub panda, opendbc and tqdm, so the standard library is enough.
    - name: Run the tool tests
      run: python -m unittest discover -s eps_tools/tests -v
    - name: Lint
      run: |
        python -m pip install --quiet ruff==0.16.9
        ruff check eps_tools --config eps_tools/ruff.toml
